name: Validate NŪB evidence records

on:
  pull_request:
    paths:
      - "schemas/**"
      - "scripts/validate_records.py"
      - "tests/**"
      - ".github/workflows/validate-record-schema.yml"
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "scripts/validate_records.py"
      - "tests/**"
      - ".github/workflows/validate-record-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-schema-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.23,<5"
      - name: Validate synthetic fixture
        run: python scripts/validate_records.py tests/fixtures/record-valid-unknown.json
      - name: Run schema regression tests
        run: python -m unittest discover -s tests -v
