name: Validate NŪB static experience

on:
  pull_request:
    paths:
      - "*.html"
      - "tests/test_static_site_quality.py"
      - "tests/test_internal_links.py"
      - ".github/workflows/validate-static-experience.yml"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "tests/test_static_site_quality.py"
      - "tests/test_internal_links.py"
      - ".github/workflows/validate-static-experience.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-experience-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit accessibility baseline and safe links
        run: python -m unittest discover -s tests -p "test_static_site_quality.py" -v
      - name: Audit local links and fragment targets
        run: python -m unittest discover -s tests -p "test_internal_links.py" -v
